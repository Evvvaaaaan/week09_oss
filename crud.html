<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Students</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <a href="index.html">Home</a>
    <h1>Manage Students</h1>
    <p>Use fictional student information for this exercise.</p>
    <h2 id="form-title">Add student</h2>
    <form id="student-form" novalidate>
      <label for="name">Name (2–50 characters)</label>
      <input id="name" name="name" required minlength="2" maxlength="50">
      <label for="age">Age (1–120)</label>
      <input id="age" name="age" type="number" required min="1" max="120" step="1">
      <label for="major">Major (2–60 characters)</label>
      <input id="major" name="major" required minlength="2" maxlength="60">
      <label for="year">Study year (1–6)</label>
      <input id="year" name="year" type="number" required min="1" max="6" step="1">
      <div class="actions">
        <button id="save" type="submit">Add student</button>
        <button id="cancel" type="button">Cancel edit</button>
      </div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="list-title">
      <h2 id="list-title">Students</h2>
      <label for="search">Search by name or major</label>
      <input id="search" type="search">
      <button id="refresh" type="button">Refresh list</button>
      <p id="count"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Major</th><th>Year</th><th>Actions</th></tr></thead>
          <tbody id="student-list"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
